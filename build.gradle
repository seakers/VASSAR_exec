plugins {
    id 'java'
    id 'maven-publish'

}

group 'seakers'
version '1.0'

sourceCompatibility = 11
targetCompatibility = 11
repositories {
    flatDir {
        dirs 'C:/Users/dfornos/.m2/repository/javax/media/jai_core/1.1.3'
    }
    mavenLocal()
    mavenCentral()

}

dependencies {
    implementation 'org.moeaframework:moeaframework:2.12'
    implementation 'seakers:system-architecture-problems:1.0'
    implementation 'seakers:vassar:1.0'
    implementation 'net.sf.py4j:py4j:0.10.9.5'
    // Eclipse Paho MQTT Client Library
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Gson Library for JSON parsing
    implementation 'com.google.code.gson:gson:2.8.6'


    // JSON Library (if needed for JSONObject)
    implementation 'org.json:json:20210307'

    // VASSAR specific libraries (replace with actual library paths or Maven coordinates if available)
    implementation files('path/to/vassar.jar') // Replace with the actual path or Maven coordinate

    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'vassartest'
            from components.java
        }
    }
}
