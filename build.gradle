plugins {
    id 'java'
    id 'maven-publish'
}

group = 'seakers'
version = '1.0'

// Use Java 17
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Old 'compile' → 'implementation'
    implementation 'org.moeaframework:moeaframework:2.12'
    implementation 'seakers:system-architecture-problems:1.0'
    implementation 'seakers:engineer-server:1.0'
    implementation 'seakers:mopAOS:1.0'
    implementation files('/app/EOSS/java/mopAOS.jar')
    implementation 'seakers:EOSSAIAA:1.0-SNAPSHOT'
    implementation 'gov.sandia:jess:7.1p2'
    implementation 'com.google.code.gson:gson:2.7'
    implementation 'seakers:vassar:1.0'

    implementation 'seakers:orekit:1.0'

    // Old 'testCompile' → 'testImplementation'
    testImplementation 'junit:junit:4.12'
}

/* ---------------- JavaExec Tasks ---------------- */

task run(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.App'
    jvmArgs = ['-Xms20g', '-XX:NewSize=5g']
}

task runServer(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.AppServer'
    jvmArgs = ['-Xms20g', '-XX:NewSize=5g']
}

task runParallel(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.AppParallel'
}

task genPop(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.GeneratePopulation'
    jvmArgs = ['-Xms10g']
}

task evalPop(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.EvaluatePopulation'
    jvmArgs = ['-Xms10g']
}

task evalPopMulti(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.EvaluatePopulationMultiProc'
}

task enumCoverage(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.EnumerateCoverageCalcs'
}

task consCalcs(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.ConsolidateCalcs'
}

task runDebug(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seakers.vassartest.DebugRun'
}

/* ---------------- Publishing ---------------- */

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'vassarexec'
            from components.java
        }
    }
}
